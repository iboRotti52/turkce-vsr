scientific_verdict: REJECT
decision_id: D24
belief_id: B-SMALL-001

updated_belief: >
  In the frozen c0.4 small-data regime, more clips from the same limited
  speaker/source pool can improve CTC likelihood without improving transcription
  CER. Same-regime clip-count scaling is no longer a high-value next direction.

revalidation_trigger: >
  Re-open this belief after a substantially more diverse pinned HF snapshot is
  available, or after an objective/architecture change materially changes the
  loss-to-CER relationship.

next_question: ARCH-LD-001

literature_context:
  - title: "Auto-AVSR: Audio-Visual Speech Recognition with Automatic Labels"
    arxiv: "2303.14307"
    role: Larger and automatically labelled training sets can improve VSR; motivates re-testing under genuinely broader data.
  - title: "Multilingual Audio-Visual Speech Recognition with Hybrid CTC/RNN-T Fast Conformer"
    arxiv: "2405.12983"
    role: Keeps sequence objective/temporal modeling open when larger-scale data becomes available.
  - title: "Audio-Visual Efficient Conformer for Robust Speech Recognition"
    arxiv: "2301.01456"
    role: Intermediate CTC/residual mechanisms motivate testing whether plain CTC is a large-data bottleneck.
  - title: "SwinLip"
    arxiv: "2505.04394"
    role: Frontend efficiency/representation remains an alternative if large-data subgroup analysis points to visual encoding.
  - title: "VALLR"
